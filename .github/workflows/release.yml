name: Release

on:
  push:
    tags:
      - "v*-petlibro.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Validate tag and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git tag --points-at HEAD)" = "${GITHUB_REF_NAME}"
          go test ./pkg/petlibro ./cmd/petlibro-resolve -count=1
          go test ./internal/streams -run '^Test(TimestampContinuity|StreamCorrelationIDs)' -count=1
          go test ./pkg/rtsp -run '^Test(PacketWriter|PacketWriters|WriteInterleavedData)' -count=1
          go vet ./internal/streams ./pkg/petlibro ./pkg/rtsp ./cmd/petlibro-resolve

      - name: Build release artifacts
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          go build -trimpath -ldflags="-s -w" -o dist/bin/go2rtc .
          go build -trimpath -ldflags="-s -w" -o dist/bin/petlibro-resolve ./cmd/petlibro-resolve
          tar -C dist/bin -czf "dist/go2rtc_${GITHUB_REF_NAME}_linux_amd64.tar.gz" go2rtc petlibro-resolve
          git archive --format=tar --prefix="go2rtc-${GITHUB_REF_NAME}/" HEAD \
            | gzip -n > "dist/go2rtc_${GITHUB_REF_NAME}_source.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/go2rtc_*.tar.gz
            dist/SHA256SUMS
